server:
  port: 8085
  # HTTP通信時：false
  # HTTPS通信時：true（デフォルト）
  servlet:
    session:
      cookie:
        secure: false
logging:
  file:
    name: /Users/taiseikato/Projects/ITive/logs/general.log
  level:
    root: INFO
    org:
      seasar:
        doma: INFO
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ITive
    username: ITive
    password: ITive
    driverClassName: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:/Users/taiseikato/Projects/ITive/
      cache:
        cachecontrol:
          max-age: 0

env: develop
# 一般サイト設定
general-config:
  # 画像アップロード関連
  image:
    # ブック画像
    books:
      # 画像URL
      base-url: http://ITive.local/img/book
      temp-base-url: http://ITive.local/img/book/tmp