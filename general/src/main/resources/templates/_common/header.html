<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div th:fragment="menu" th:remove="tag">
      <header class="app-bar">
        <div class="app-bar-title" id="app-bar-brand">
          <img th:src="@{/public/img/app_title_light.png}" alt="ibooks">
        </div>
      </header>

      <script>
        $(function() {
          $('#app-bar-brand').on("click", function() {
            window.location.href = "/book";
          });
        });
      </script>
    </div>
  </body>
</html>
