<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:with="title='ブック一覧'">
<head th:replace="~{_common/head::head}"></head>
<body>
    <div th:replace="~{_common/topHeader::topHeader('index', ${categories})}"></div>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-header" id="sidebarBrand">
                <img th:src="@{/public/img/app_title_dark.png}" alt="ITive" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <a th:href="@{/book}" class="home-header">
                    <span class="mdi mdi-home-outline"></span>ホーム
                </a>
                <div class="accordion">
                    <button class="category-accordion-header" id="categoryAccordionHeaderBtn">
                        <span class="mdi mdi-shape-plus-outline"></span>
                        <span class="category-accordion-header-name">カテゴリ</span>
                    </button>
                    <div class="category-accordion-content">
                        <ul class="category-list">
                            <th:block th:each="category : ${categories}">
                                <li>
                                    <a href="#" class="category-item" th:data-category-id="${category.id}" th:text="${category.name}"></a>
                                </li>
                            </th:block>
                        </ul>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <h1 class=" u-fs-2 u-fw-700" style="margin-top: 16px; margin-left: 16px;">
                <span class="mdi mdi-book-open-variant-outline me-2"></span>
                レベル別おすすめブック<span th:if="${searchForm != null and searchForm.schCategory != null}" th:text="'（' + ${categoryMap.get(searchForm.schCategory)} + '）'"></span>
            </h1>
            <!-- レベル別タブ -->
            <div class="book-list-tabs">
                <ul class="nav nav-tabs book-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-level-tab="BEGINNER" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-1 u-me8"></span>初心者
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-level-tab="INTERMEDIATE" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-2 u-me8"></span>中級者
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-level-tab="ADVANCED" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-3 u-me8"></span>上級者
                        </button>
                    </li>
                </ul>
            </div>

            <main class="container">
                <div th:replace="~{_common/messages::errors}"></div>

                <!-- ブック情報未登録時のアラート警告 -->
                <div class="error-message-wrapper" id="noBooksAlert" style="display: none;">
                    <img th:src="@{/public/img/not_result.png}" alt="警告画像">
                    <ul>
                        <li>ブック情報がまだ存在していません</li>
                    </ul>
                </div>

                <th:block th:unless="${#lists.isEmpty(books)}">
                    <!--/*
                    <div th:each="book : ${books}" class="book-list-wrapper" th:data-level="${book.level}">
                        <div class="book-image">
                            <img th:src="${book.picFileName != null and book.picFileName != '' ?
                                @booksImageConfigImpl.getBooksImgUrl(book.bookId, book.picFileName) :
                                @booksImageConfigImpl.getImgUrl('no_image.jpg')}"
                                alt="書籍画像" />
                        </div>
                        <div class="book-content">
                            <a th:href="@{/book/detail/{id}(id=${book.bookId})}" class="js-loading-link">
                                <h1 class="book-title">[[${book.title}]]</h1>
                            </a>
                            <div class="book-level-category">
                                <div class="book-categories">
                                    <th:block th:each="id : ${ {book.categoryId1, book.categoryId2, book.categoryId3} }">
                                        <p th:if="${id != null}" th:class="|book-category category-color-${id % 10}|">
                                            [[${categoryMap.get(id)}]]
                                        </p>
                                    </th:block>
                                </div>
                            </div>
                        </div>
                    </div>
                    */-->
                </th:block>
            </main>
            <div th:replace="~{_common/footer::footer}"></div>
        </div>
    </div>

    <form id="categorySearchForm" th:action="@{/book/search}" method="post" style="display:none;">
        <input type="hidden" name="schCategory" id="schCategoryInput" value="" />
    </form>

<div th:replace="~{_common/script::csrfHeader}"></div>
<script>
    $(function() {
        // レベル別フィルタリングの定義
        function filterBooks(level) {
            let visibleCount = 0;
            $('.book-list-wrapper').each(function() {
                const bookLevel = $(this).data('level');
                if (bookLevel === level) {
                    $(this).show();
                    visibleCount++;
                } else {
                    $(this).hide();
                }
            });

            // Thymeleaf側でエラー画像が表示されている場合は、本アラート（noBooksAlert）を非表示にする
            if ($('#m_message_origin_error').length > 0) {
                $('#noBooksAlert').hide();
            } else if (visibleCount === 0) {
                $('#noBooksAlert').show();
            } else {
                $('#noBooksAlert').hide();
            }
        }

        $('[data-level-tab]').on('click', function() {
            $('[data-level-tab]').removeClass('active');
            $(this).addClass('active');
            const targetLevel = $(this).data('level-tab');
            filterBooks(targetLevel);
        });

        // 初期表示制御
        const initialLevel = $('[data-level-tab].active').data('level-tab');
        if (initialLevel) {
            filterBooks(initialLevel);
        } else {
            if ($('#m_message_origin_error').length === 0 && $('.book-list-wrapper').length === 0) {
                $('#noBooksAlert').show();
            } else {
                $('#noBooksAlert').hide();
            }
        }

        $('#sidebarBrand').on('click', function() {
            ibooks.showLoading();
            window.location.href = '/book';
        });

        const categoryAccordionHeader = document.getElementById('categoryAccordionHeaderBtn');
        const categoryAccordionContent = document.querySelector('.category-accordion-content');

        // ページロード時にアコーディオンを自動で開く
        if (categoryAccordionContent && categoryAccordionHeader) {
            categoryAccordionContent.style.maxHeight = categoryAccordionContent.scrollHeight + 'px';
            categoryAccordionHeader.classList.add('is-open');
        }

        categoryAccordionHeader.addEventListener('click', () => {
            if (categoryAccordionContent.style.maxHeight === '0px' || categoryAccordionContent.style.maxHeight === '') {
                categoryAccordionContent.style.maxHeight = categoryAccordionContent.scrollHeight + 'px';
                categoryAccordionHeader.classList.add('is-open');
            } else {
                categoryAccordionContent.style.maxHeight = '0px';
                categoryAccordionHeader.classList.remove('is-open');
            }
        });

        $('.category-item').on('click', function(e) {
            e.preventDefault();
            const categoryId = $(this).data('categoryId');

            if (categoryId) {
                $('#schCategoryInput').val(categoryId);
                ibooks.showLoading();
                $('#categorySearchForm').submit();
            } else {
                window.location.href = '/book';
            }
        });

        $('.js-loading-link').click(function(e) {
            ibooks.showLoading();
            setTimeout(() => {
                window.location.href = $(this).attr('href');
            }, 50);
            e.preventDefault();
        });

        const categoryIcons = {
            1: 'mdi-school-outline',
            2: 'mdi-database-outline',
            3: 'mdi-cloud-outline',
            4: 'mdi-web',
            5: 'mdi-briefcase-outline',
            6: 'mdi-book-open-page-variant-outline',
            7: 'mdi-cellphone',
            8: 'mdi-robot-outline',
            9: 'mdi-tools',
            10: 'mdi-code-tags',
            11: 'mdi-account-tie-outline',
            12: 'mdi-shield-check-outline'
        };
        $('.category-item').each(function () {
            const categoryId = $(this).data('category-id');
            const iconClass = categoryIcons[categoryId];

            if (iconClass) {
                $(this).prepend(
                    $('<i>')
                        .addClass('mdi')
                        .addClass(iconClass)
                );
            }
        });
    });
</script>
</body>
</html>
