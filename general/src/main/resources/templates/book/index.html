<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:with="title='ブック一覧'">
<head th:replace="~{_common/head::head}"></head>
<body>
    <div th:replace="~{_common/topHeader::topHeader('index', ${categories})}"></div>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-header" id="sidebarBrand">
                <img th:src="@{/public/img/app_title_dark.png}" alt="ITive" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <a th:href="@{/itive/book}" class="home-header">
                    <span class="mdi mdi-home-outline"></span>ホーム
                </a>
                <div class="accordion">
                    <button class="category-accordion-header" id="categoryAccordionHeaderBtn">
                        <span class="mdi mdi-shape-plus-outline"></span>
                        <span class="category-accordion-header-name">カテゴリ</span>
                    </button>
                    <div class="category-accordion-content">
                        <ul class="category-list">
                            <th:block th:each="category : ${categories}">
                                <li>
                                    <a href="#" class="category-item" th:data-category-id="${category.id}" th:text="${category.name}"></a>
                                </li>
                            </th:block>
                        </ul>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <h1 class="main-content-title">
                <span class="mdi mdi-book-open-variant-outline"></span>
                ブック一覧<span th:if="${searchForm != null and searchForm.schCategory != null}" th:text="'（' + ${categoryMap.get(searchForm.schCategory)} + '）'"></span>
            </h1>
            <!-- レベル別タブ -->
            <div class="book-list-tabs">
                <ul class="nav nav-tabs book-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-level-tab="BEGINNER" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-1"></span>初心者
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-level-tab="INTERMEDIATE" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-2"></span>中級者
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-level-tab="ADVANCED" type="button" role="tab">
                            <span class="mdi mdi-signal-cellular-3"></span>上級者
                        </button>
                    </li>
                </ul>
            </div>

            <main class="container">
                <div th:replace="~{_common/messages::errors}"></div>

                <!-- ブック情報未登録時のアラート警告 -->
                <div class="error-message-wrapper" id="noBooksAlert" style="display: none;">
                    <img th:src="@{/public/img/not_result.png}" alt="警告画像">
                    <ul>
                        <li>ブック情報がまだ存在していません</li>
                    </ul>
                </div>

                <th:block th:unless="${#lists.isEmpty(books)}">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
                        <div th:each="book : ${books}" class="col book-card-item" th:data-level="${book.level}">
                            <div class="card h-100 shadow-sm border-0 book-card">
                                <div class="card-img-container">
                                    <img th:src="${book.picFileName != null and book.picFileName != '' ?
                                        @booksImageConfigImpl.getBooksImgUrl(book.bookId, book.picFileName) :
                                        @booksImageConfigImpl.getImgUrl('no_image.jpg')}"
                                        class="card-img-top"
                                        alt="書籍画像" />
                                </div>
                                <div class="card-body d-flex flex-column p-3">
                                    <a th:href="@{/book/detail/{id}(id=${book.bookId})}" class="js-loading-link card-title-link">
                                        <h5 class="card-title">[[${book.title}]]</h5>
                                    </a>
                                    <p class="card-text">[[${book.subTitle}]]</p>
                                </div>
                                <div class="card-footer bg-transparent border-top-0 px-3 pb-3 pt-0">
                                    <div class="book-categories d-flex flex-wrap gap-1">
                                        <th:block th:each="id : ${ {book.categoryId1, book.categoryId2, book.categoryId3} }">
                                            <span th:if="${id != null}" th:class="|book-category category-color-${id % 10} m-0|" th:text="${categoryMap.get(id)}"></span>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>
            </main>
            <div th:replace="~{_common/footer::footer}"></div>
        </div>
    </div>

    <form id="categorySearchForm" th:action="@{/book/search}" method="post" style="display:none;">
        <input type="hidden" name="schCategory" id="schCategoryInput" value="" />
    </form>

<div th:replace="~{_common/script::csrfHeader}"></div>
<script>
    $(function() {
        // レベル別フィルタリングの定義
        function filterBooks(level) {
            let visibleCount = 0;
            $('.book-card-item').each(function() {
                const bookLevel = $(this).data('level');
                if (bookLevel === level) {
                    $(this).show();
                    visibleCount++;
                } else {
                    $(this).hide();
                }
            });

            // Thymeleaf側でエラー画像が表示されている場合は、本アラート（noBooksAlert）を非表示にする
            if ($('#m_message_origin_error').length > 0) {
                $('#noBooksAlert').hide();
            } else if (visibleCount === 0) {
                $('#noBooksAlert').show();
            } else {
                $('#noBooksAlert').hide();
            }
        }

        $('[data-level-tab]').on('click', function() {
            $('[data-level-tab]').removeClass('active');
            $(this).addClass('active');
            const targetLevel = $(this).data('level-tab');
            filterBooks(targetLevel);
        });

        // 初期表示制御
        const initialLevel = $('[data-level-tab].active').data('level-tab');
        if (initialLevel) {
            filterBooks(initialLevel);
        } else {
            if ($('#m_message_origin_error').length === 0 && $('.book-card-item').length === 0) {
                $('#noBooksAlert').show();
            } else {
                $('#noBooksAlert').hide();
            }
        }

        $('#sidebarBrand').on('click', function() {
            ibooks.showLoading();
            window.location.href = '/itive/book';
        });

        // ページロード時にアコーディオンを自動で開く
        const $categoryAccordionHeader = $('#categoryAccordionHeaderBtn');
        const $categoryAccordionContent = $('.category-accordion-content');

        function openCategoryAccordion() {
            $categoryAccordionContent.css('max-height', 'none');

            const height = $categoryAccordionContent[0].scrollHeight;

            $categoryAccordionContent.css('max-height', height + 'px');
            $categoryAccordionHeader.addClass('is-open');
        }

        $(window).on('load', function () {
            if ($categoryAccordionContent.length && $categoryAccordionHeader.length) {
                openCategoryAccordion();
            }
        });

        $categoryAccordionHeader.on('click', function () {
            if ($categoryAccordionContent.css('max-height') === '0px') {
                openCategoryAccordion();
            } else {
                $categoryAccordionContent.css('max-height', '0px');
                $categoryAccordionHeader.removeClass('is-open');
            }
        });

        $('.category-item').on('click', function(e) {
            e.preventDefault();
            const categoryId = $(this).data('categoryId');

            if (categoryId) {
                $('#schCategoryInput').val(categoryId);
                ibooks.showLoading();
                $('#categorySearchForm').submit();
            } else {
                window.location.href = '/book';
            }
        });

        $('.js-loading-link').click(function(e) {
            ibooks.showLoading();
            setTimeout(() => {
                window.location.href = $(this).attr('href');
            }, 50);
            e.preventDefault();
        });

        const categoryIcons = {
            1: 'mdi-code-tags',
            2: 'mdi-web',
            3: 'mdi-cellphone',
            4: 'mdi-database',
            5: 'mdi-server',
            6: 'mdi-lan',
            7: 'mdi-cloud-outline',
            8: 'mdi-shield-lock-outline',
            9: 'mdi-robot-outline',
            10: 'mdi-chart-line',
            11: 'mdi-function-variant',
            12: 'mdi-source-branch',
            13: 'mdi-cogs',
            14: 'mdi-test-tube',
            15: 'mdi-ruler-square-compass',
            16: 'mdi-account-tie',
            17: 'mdi-account-group',
            18: 'mdi-clipboard-check-outline',
            19: 'mdi-briefcase-outline',
            20: 'mdi-account-supervisor',
            21: 'mdi-certificate-outline',
            22: 'mdi-trending-up',
            23: 'mdi-domain'
        };
        $('.category-item').each(function () {
            const categoryId = $(this).data('category-id');
            const iconClass = categoryIcons[categoryId];

            if (iconClass) {
                $(this).prepend(
                    $('<i>')
                        .addClass('mdi')
                        .addClass(iconClass)
                );
            }
        });
    });
</script>
</body>
</html>
