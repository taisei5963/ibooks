<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_common/head::head}"></head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-header" id="sidebarBrand">
                <img th:src="@{/public/img/app_title_dark.png}" alt="ITive" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <div class="accordion">
                    <button class="category-accordion-header" id="categoryAccordionHeaderBtn">
                        カテゴリ
                    </button>
                    <div class="category-accordion-content">
                        <ul class="category-list">
                            <th:block th:each="category : ${categories}">
                                <li>
                                    <a href="#" class="category-item" th:data-category-id="${category.id}" th:text="${category.name}"></a>
                                </li>
                            </th:block>
                        </ul>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <main class="container">
                <div class="message-area">
                    <div th:replace="~{_common/messages::messages}"></div>
                    <div th:replace="~{_common/messages::errors}"></div>
                </div>

                <div th:unless="${#lists.isEmpty(books)}" class="book-list-section">
                    <div class="book-grid">
                        <a th:each="book : ${books}" th:href="@{/book/detail/{id}(id=${book.bookId})}" class="book-gallery-card js-loading-link">

                            <div class="book-image-wrapper">
                                <img th:src="${book.picFileName != null and book.picFileName != '' ? @booksImageConfigImpl.getBooksImgUrl(book.bookId, book.picFileName) : @booksImageConfigImpl.getImgUrl('no_image.jpg')}"
                                    alt="書籍画像" />
                            </div>

                            <div class="book-overlay">
                                <h2 class="book-overlay-title" th:text="${book.title}"></h2>
                                <p class="book-overlay-subtitle" th:if="${book.subTitle}" th:text="${book.subTitle}"></p>
                            </div>
                        </a>
                    </div>
                </div>
            </main>
            <div th:replace="~{_common/footer::footer}"></div>
        </div>
    </div>

    <form id="categorySearchForm" th:action="@{/book/search}" method="post" style="display:none;">
        <input type="hidden" name="schCategory" id="schCategoryInput" value="" />
    </form>

<div th:replace="~{_common/script::csrfHeader}"></div>
<script>
    $(function() {
        $('#sidebarBrand').on('click', function() {
            ibooks.showLoading();
            window.location.href = '/book';
        });

        const categoryAccordionHeader = document.getElementById('categoryAccordionHeaderBtn');
        const categoryAccordionContent = document.querySelector('.category-accordion-content');

        // ページロード時にアコーディオンを自動で開く
        if (categoryAccordionContent && categoryAccordionHeader) {
            categoryAccordionContent.style.maxHeight = categoryAccordionContent.scrollHeight + 'px';
            categoryAccordionHeader.classList.add('is-open');
        }

        categoryAccordionHeader.addEventListener('click', () => {
            if (categoryAccordionContent.style.maxHeight === '0px' || categoryAccordionContent.style.maxHeight === '') {
                categoryAccordionContent.style.maxHeight = categoryAccordionContent.scrollHeight + 'px';
                categoryAccordionHeader.classList.add('is-open');
            } else {
                categoryAccordionContent.style.maxHeight = '0px';
                categoryAccordionHeader.classList.remove('is-open');
            }
        });

        $('.category-item').on('click', function(e) {
            e.preventDefault();
            const categoryId = $(this).data('categoryId');

            if (categoryId) {
                $('#schCategoryInput').val(categoryId);
                ibooks.showLoading();
                $('#categorySearchForm').submit();
            } else {
                window.location.href = '/book';
            }
        });

        $('.js-loading-link').click(function(e) {
            ibooks.showLoading();
            setTimeout(() => {
                window.location.href = $(this).attr('href');
            }, 50);
            e.preventDefault();
        });
    });
</script>
</body>
</html>
