<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:with="title='ホーム'">
<head th:replace="~{_common/head::head}"></head>
<body class="content-body">
    <div th:replace="~{_common/sidebar::sidebar}"></div>
    <div class="main-content">
        <main class="container">
            <div class="count-card">
                <div>
                    <div class="count-card-title">BOOKS</div>
                    <div class="count-card-value">
                        <span th:text="${bookCount}">0</span>冊
                    </div>
                </div>
                <div>
                    <span class="mdi mdi-book-multiple"></span>
                </div>
            </div>
        </main>
    </div>

<div th:replace="~{_common/script::csrfHeader}"></div>
<!-- <div th:replace="~{_common/script::asyncDownloadCsvFile}"></div> -->
<div th:replace="~{_common/footer::footer}"></div>

<script>
    $(function() {
        $('#search-btn').click(function() {
            var $form = $(this).closest('form');
            $('#search-page').val('0');
            ibooks.showLoading();
            $form.submit();
        });

        $('.js-loading-link').click(function(e) {
            ibooks.showLoading();
            setTimeout(() => {
                window.location.href = $(this).attr('href');
            }, 50);
            e.preventDefault();
        });
    });
</script>
</body>
</html>
