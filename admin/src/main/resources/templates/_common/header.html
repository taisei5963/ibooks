<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div th:fragment="menu" th:remove="tag">
      <header class="app-bar">
        <div class="header-right">
          <div class="dropdown user-dropdown">
            <a href="#" class="dropdown-toggle" id="userDropdownToggle">
              <i class="fas fa-user-circle fa-2x"></i>
            </a>
            <div class="dropdown-menu user-dropdown-menu">
              <p class="dropdown-item loginUserName">[[${adminDto?.name}]]</p>
              <a th:href="@{/changePassword}" class="dropdown-item">パスワード変更</a>
              <form th:action="@{/login/logout}" method="post" class="dropdown-item-form">
                <button type="submit" class="dropdown-item mobile-logout-btn">ログアウト</button>
              </form>
            </div>
          </div>
        </div>
      </header>

      <script th:inline="javascript">
        $(function() {
          $('#app-bar-brand').on("click", function() {
            window.location.href = "/admin/book";
          });
        });
      </script>
    </div>
  </body>
</html>
