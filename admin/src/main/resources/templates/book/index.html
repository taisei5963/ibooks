<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:with="title='ブック一覧'">
<head th:replace="~{_common/head::head}"></head>
<body>
    <div th:replace="~{_common/sidebar::sidebar}"></div>

    <div class="main-content">
        <main class="container">
            <h1 id="pageName" class="u-fs-2 u-fw-700"></h1>
            <div class="search-cond u-mb16">
                <div th:replace="~{_common/messages::messages}"></div>
                <div th:replace="~{_common/messages::errors}"></div>
            </div>

            <div class="u-mb32">
                <form th:action="@{/book/search}" method="post">
                    <div class="search-grid">
                        <div class="search-field">
                            <label for="schTitle" class="u-mb8 u-d-block u-fw-700">
                                <span class="mdi mdi-book-open-variant" style="margin-right: 8px; color: #aaa;"></span>タイトル（部分一致）
                            </label>
                            <input type="text" id="schTitle" name="schTitle" th:value="${searchForm?.schTitle}" maxlength="100" class="u-w100">
                        </div>

                        <div class="search-field">
                            <label for="schAuthor" class="u-mb8 u-d-block u-fw-700">
                                <span class="mdi mdi-account" style="margin-right: 12px; color: #aaa;"></span>著者（部分一致）
                            </label>
                            <input type="text" id="schAuthor" name="schAuthor" th:value="${searchForm?.schAuthor}" maxlength="60" class="u-w100">
                        </div>

                        <div class="search-field">
                            <label for="schPublisher" class="u-mb8 u-d-block u-fw-700">
                                <span class="mdi mdi-domain" style="margin-right: 12px; color: #aaa;"></span>出版社（部分一致）
                            </label>
                            <input type="text" id="schPublisher" name="schPublisher" th:value="${searchForm?.schPublisher}" maxlength="60" class="u-w100">
                        </div>

                        <div class="search-field">
                            <label for="schCategory" class="u-mb8 u-d-block u-fw-700">
                                <span class="mdi mdi-tag-outline" style="margin-right: 12px; color: #aaa; pointer-events: none;"></span>カテゴリ
                            </label>
                            <select id="schCategory" name="schCategory" class="u-w100">
                                <option value="">すべて</option>
                                <th:block th:each="category : ${categories}">
                                    <option th:value="${category.id}"
                                        th:selected="${searchForm?.schCategory == category.id}"
                                    >[[${category.name}]]</option>
                                </th:block>
                            </select>
                        </div>
                    </div>
                    <div class="search-action u-text-center u-mt24">
                        <button type="button" id="search-btn" class="btn-primary">検索</button>
                    </div>
                </form>
            </div>
            <th:unless="${#lists.isEmpty(books)}">
                <div th:replace="~{_common/pager::pager}"></div>

                <table class="search-result-table">
                    <thead>
                        <tr>
                            <th style="font-weight: bold;">詳細</th>
                            <th style="font-weight: bold;">画像</th>
                            <th style="font-weight: bold;">タイトル<br>カテゴリ</th>
                            <th style="font-weight: bold;">著者</th>
                            <th style="font-weight: bold;">出版社</th>
                            <th style="font-weight: bold;">削除</th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:each="book : ${books}">
                            <tr class="search-result-card">
                                <td>
                                    <button type="button" th:onclick="|location.href='@{/book/detail/{id}(id=${book.bookId})}'|">
                                        <span class="mdi mdi-information-variant"></span>
                                    </button>
                                </td>
                                <td>
                                    <div class="book-image-wrapper">
                                        <img th:src="${book.picFileName != null and book.picFileName != '' ? @booksImageConfigImpl.getBooksImgUrl(book.bookId, book.picFileName) : @booksImageConfigImpl.getImgUrl('no_image.jpg')}"
                                            alt="書籍画像" />
                                    </div>
                                </td>
                                <td>
                                    <div class="book-title-category">
                                        <h2 class="book-title" th:text="${book.title}"></h2>
                                        <div class="book-category">
                                            <th:block th:each="id : ${ {book.categoryId1, book.categoryId2, book.categoryId3} }">
                                                <span th:if="${id != null}" th:class="|category-color-${id % 10}|">
                                                    [[${categoryMap.get(id)}]]
                                                </span>
                                            </th:block>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="book-author" th:if="${book.author2 != null}">
                                        <h2>[[${book.author1}]]</h2>
                                        <h2>[[${book.author2}]]</h2>
                                    </div>
                                    <div class="book-author" th:unless="${book.author2 != null}">
                                        <h2>[[${book.author1}]]</h2>
                                    </div>
                                </td>
                                <td>
                                    <div class="book-publisher">
                                        <h2>[[${book.publisher}]]</h2>
                                    </div>
                                </td>
                                <td>
                                    <button type="button">
                                        <span class="mdi mdi-delete"></span>
                                    </button>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

<div th:replace="~{_common/script::csrfHeader}"></div>
<!-- <div th:replace="~{_common/script::asyncDownloadCsvFile}"></div> -->
<div th:replace="~{_common/footer::footer}"></div>
<script th:replace="~{_common/script::setPageTitle}"></script>
<script>
    $(function() {
        $('#search-btn').click(function() {
            var $form = $(this).closest('form');
            $('#search-page').val('0');
            ibooks.showLoading();
            $form.submit();
        });

        $('.js-loading-link').click(function(e) {
            ibooks.showLoading();
            setTimeout(() => {
                window.location.href = $(this).attr('href');
            }, 50);
            e.preventDefault();
        });
    });
</script>
</body>
</html>
